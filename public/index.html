<!DOCTYPE html>
<html>
<head>
  <title>EcoVerse - Virtual Rainforest Explorer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('vertical-controls', {
      init: function () {
        this.speed = 0.1;
        this.moveUp = false;
        this.moveDown = false;

        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space') this.moveUp = true;
          if (e.code === 'ControlLeft' || e.code === 'ControlRight') this.moveDown = true;
        });

        window.addEventListener('keyup', (e) => {
          if (e.code === 'Space') this.moveUp = false;
          if (e.code === 'ControlLeft' || e.code === 'ControlRight') this.moveDown = false;
        });
      },

      tick: function () {
        let position = this.el.getAttribute('position');
        if (this.moveUp) {
          position.y += this.speed;
          this.el.setAttribute('position', position);
        }
        if (this.moveDown) {
          position.y -= this.speed;
          this.el.setAttribute('position', position);
        }
      }
    });
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="hud-hint">Click an animal or plant to learn about it &middot; WASD to move and Space/Control to move up/down &middot; Drag to look around</div>

  <div id="info-panel" class="hidden">
    <button id="panel-close">&times;</button>
    <h2 id="panel-name">Species Name</h2>
    <div id="panel-details"></div>

    <div class="sighting-form">
      <input type="text" id="researcher-name" placeholder="Your name (researcher)">
      <textarea id="sighting-note" rows="2" placeholder="Field note (e.g. 'Spotted near the river at dawn')"></textarea>
      <button id="log-sighting-btn">Log Sighting</button>
    </div>
  </div>

  <div id="status-msg" class="hidden"></div>

  <!-- ===================== A-FRAME SCENE ===================== -->
  <a-scene fog="type: exponential; color: #cfe8c0; density: 0.08" loading-screen="backgroundColor: #0f1f0f; dotsColor: #6bbf59">

    <a-assets timeout="60000">
      <!-- Textures -->
      <img id="jungle-floor" src="assets/textures/jungle_floor_diff.jpg" alt="">
      <img id="jungle-floor-nrm" src="assets/textures/jungle_floor_nor.jpg" alt="">
      <img id="sky-texture" src="assets/textures/jungle_sky.jpg" alt="">

      <!-- 3D Models -->
      <a-asset-item id="forest-model" src="assets/models/forest.glb"></a-asset-item>
      <a-asset-item id="pine-forest-model" src="assets/models/pine_forest.glb"></a-asset-item>
      <a-asset-item id="rock-model" src="assets/models/rock.glb"></a-asset-item>
      <a-asset-item id="banana-tree-asset" src="assets/models/banana_tree_low_poly.glb"></a-asset-item>
      <a-asset-item id="jungle-tree-asset" src="assets/models/realistic_jungle_tree_avatar.glb"></a-asset-item>
      <a-asset-item id="crocodile-asset" src="assets/models/crocodile_high_quality.glb"></a-asset-item>
      <a-asset-item id="frog-asset" src="assets/models/frog.glb"></a-asset-item>
      <a-asset-item id="colibri-asset" src="assets/models/colibri.glb"></a-asset-item>
      <a-asset-item id="capybara-asset" src="assets/models/capybara.glb"></a-asset-item>
      <a-asset-item id="jaguar-asset" src="assets/models/jaguar.glb"></a-asset-item>
    </a-assets>

    <!-- ===================== SKY ===================== -->
    <a-sky src="#sky-texture" rotation="0 90 0"></a-sky>

    <!-- ===================== GROUND ===================== -->
    <a-plane
      material="color: #FFFFFF; src: #jungle-floor; normal-map: #jungle-floor-nrm; repeat: 20 20; normal-texture-repeat: 20 20; roughness: 0.8"
      rotation="-90 0 0"
      scale="100 100 1">
    </a-plane>

    <!-- ===================== BACKGROUND FOREST (non-interactive set dressing) ===================== -->
    <a-entity gltf-model="#forest-model" position="0 0 -30" scale="3 3 3"></a-entity>
    <a-entity gltf-model="#pine-forest-model" position="-25 0 -20" scale="2 2 2" rotation="0 30 0"></a-entity>
    <a-entity gltf-model="#rock-model" position="6 1 -2" scale="1 1 1"></a-entity>
    <a-entity gltf-model="#rock-model" position="-3 0 -11" scale="0.8 0.8 0.8" rotation="0 60 0"></a-entity>

    <!-- ===================== INTERACTIVE SPECIES (clickable, tied to backend via app.js) ===================== -->

    <a-entity id="jaguar-model" position="30 0 -1" rotation="0 -90 0">
  <!-- The 3D visual model -->
  <a-entity gltf-model="#jaguar-asset" scale="2 2 2"></a-entity>
  
  <a-box class="clickable" material="visible: false" scale="1.3 1.3 1.3" position="0 1 1"></a-box> </a-entity>

    <a-entity id="crocodile-model" class="clickable" gltf-model="#crocodile-asset" position="-17 0 -10" scale="0.1 0.1 0.1" rotation="10 100 0"></a-entity>

    <a-entity id="capybara-model" class="clickable" gltf-model="#capybara-asset" position="-4 0.70 -5" scale="0.2 0.2 0.2"></a-entity>

    <a-entity id="frog-model" class="clickable" gltf-model="#frog-asset" position="-11 0.2 -3" scale="3 3 3"
      animation="property: position; to: -11 0.5 -3; dir: alternate; loop: true; dur: 800; easing: easeInOutQuad">
    </a-entity>

    <!-- Hummingbird hovers + gently bobs to feel alive -->
    <a-entity 
  id="colibri-model" 
  position="0 2 -6" 
  animation="property: position; to: 0 2.3 -6; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
  
  <!-- The 3D visual model -->
  <a-entity gltf-model="#colibri-asset" scale="2 2 2"></a-entity>
  
  <a-sphere class="clickable" material="visible: false" position="0 2 0" radius="0.8"> </a-sphere> </a-entity>

    <a-entity id="banana-tree-model" class="clickable" gltf-model="#banana-tree-asset" position="25 0 -4" scale="1.5 1.5 1.5"></a-entity>

    <a-entity id="banana-tree-1" gltf-model="#banana-tree-asset" position="25 0 -2" scale="1.5 1.5 1.5"></a-entity>

    <a-entity id="banana-tree-2" gltf-model="#banana-tree-asset" position="25 0 0" scale="1.5 1.5 1.5"></a-entity>

    <a-entity id="banana-tree-3" gltf-model="#banana-tree-asset" position="25 0 2" scale="1.5 1.5 1.5"></a-entity>

    <a-entity id="jungle-tree-model" class="clickable" gltf-model="#jungle-tree-asset" position="25 0 -10" scale="1.5 1.5 1.5"></a-entity>

    <!-- ===================== LIGHTING ===================== -->
    <a-entity light="type: ambient; intensity: 0.5; color: #cdeac0"></a-entity>
    <a-entity light="type: directional; intensity: 0.7; color: #fff6da; castShadow: true" position="5 10 5"></a-entity>

    <a-entity light="type: point; color: #ffeeb0; intensity: 0.6; distance: 15" position="0 8 -6"></a-entity>

    <!-- ===================== CAMERA RIG (first-person explorer) ===================== -->
<a-entity id="rig" position="0 0 4" movement-controls="speed: 0.15" vertical-controls>
  <a-camera id="player-camera" look-controls wasd-controls="acceleration: 40">
    <a-cursor
      fuse="false"
      raycaster="objects: .clickable"
      material="color: #6bbf59; shader: flat"
      geometry="radiusInner: 0.01; radiusOuter: 0.015">
    </a-cursor>
  </a-camera>
</a-entity>

  </a-scene>

  <script src="js/scene-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
